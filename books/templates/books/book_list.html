<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Books</title>
</head>
<body>
    <h1>Book List</h1>
    <a href="{% url 'book_add' %}">Add book</a>
    <ul>
        {% for book in books %}
            <li>{{ book.title }} - {{ book.author.name }} ({{ book.year|default:"-" }}) - {{ book.price|default:"-" }}
            <a href="{% url 'book_edit' book.pk %}">Edit</a>
            <a href="{% url 'book_delete' book.pk %}">Delete</a>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
